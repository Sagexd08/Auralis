<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auralis Settings</title>
    <style>
      :root {
        --bg: #0d0b09; --panel: #16130f; --raised: #1d1913; --line: rgba(255, 255, 255, 0.10);
        --text: #f4f1ec; --text-2: rgba(244, 241, 236, 0.74); --text-3: rgba(244, 241, 236, 0.58);
        --accent: #e3ad5f; --accent-ink: #1a1308; --ok: #8fd18f; --err: #ff9b8f; --warn: #f0c777;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column;
        font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
      }
      ::selection { background: var(--accent); color: var(--accent-ink); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 14px; border-bottom: 1px solid var(--line); }
      .brand { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
      .brand svg { width: 22px; height: 22px; color: var(--text); }
      #live { display: inline-flex; align-items: center; gap: 8px; max-width: 200px; padding: 5px 11px; border-radius: 999px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; color: var(--text-2); }
      #live span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #live i { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
      #live.listening i { background: #ff6b5e; animation: pulse 1s ease-in-out infinite; }
      #live.busy i { background: var(--accent); animation: pulse 0.6s ease-in-out infinite; }
      #live.ok i { background: var(--ok); }
      #live.error i { background: var(--err); }
      @keyframes pulse { 50% { opacity: 0.35; } }

      main { flex: 1; overflow-y: auto; padding: 4px 20px 24px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.2) transparent; }
      section { padding: 18px 0 6px; border-bottom: 1px solid var(--line); animation: rise 0.6s var(--ease) both; }
      section:last-of-type { border-bottom: 0; }
      section:nth-of-type(2) { animation-delay: 0.05s; } section:nth-of-type(3) { animation-delay: 0.1s; } section:nth-of-type(4) { animation-delay: 0.15s; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.01em; color: var(--text); }
      label { display: block; margin: 12px 0 5px; font-size: 13px; color: var(--text-2); }
      .hint { margin: 5px 0 0; font-size: 12px; color: var(--text-3); }

      input, select {
        width: 100%; padding: 9px 11px; font: inherit; color: var(--text);
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        transition: border-color 0.2s, background-color 0.2s;
      }
      input:hover, select:hover { border-color: rgba(255, 255, 255, 0.22); }
      input:focus, select:focus { outline: none; border-color: var(--accent); }
      select option { background: #1d1913; color: var(--text); }
      .keyrow { display: flex; gap: 8px; }
      .keyrow input { flex: 1; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; }
      .keyrow input.recording { border-color: var(--accent); background: rgba(227, 173, 95, 0.08); }

      button {
        font: inherit; cursor: pointer; color: var(--text); background: var(--raised);
        border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px;
        transition: background-color 0.2s, border-color 0.2s, transform 0.2s var(--ease), opacity 0.2s;
      }
      button:hover:not(:disabled) { background: #26211a; border-color: rgba(255, 255, 255, 0.22); }
      button:active:not(:disabled) { transform: scale(0.97); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
      button.primary:hover:not(:disabled) { background: #efbd75; border-color: #efbd75; }
      .keyrow button { flex: none; padding: 9px 12px; font-size: 13px; }

      #warning { display: none; margin: 14px 0 0; padding: 11px 13px; font-size: 13px; line-height: 1.45; color: var(--warn); background: rgba(240, 199, 119, 0.08); border: 1px solid rgba(240, 199, 119, 0.28); border-radius: 12px; }

      #models { margin-top: 2px; }
      .model { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
      .model:last-child { border-bottom: 0; }
      .model .name { flex: 1; color: var(--text-2); }
      .model .state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ok); }
      .model .state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .model button { padding: 5px 12px; font-size: 12px; }
      progress { display: block; width: 100%; height: 4px; margin-top: 8px; border: 0; border-radius: 2px; overflow: hidden; background: var(--raised); accent-color: var(--accent); }
      progress::-webkit-progress-bar { background: var(--raised); }
      progress::-webkit-progress-value { background: var(--accent); transition: width 0.2s linear; }

      footer { display: flex; align-items: center; gap: 10px; padding: 12px 20px 14px; border-top: 1px solid var(--line); background: var(--bg); }
      #status { flex: 1; min-height: 18px; font-size: 13px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #status.error { color: var(--err); }
      #status.ok { color: var(--ok); }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M 128 128 C 128 198.692 70.692 256 0 256 C 0 185.308 57.308 128 128 128 Z M 128 128 C 198.692 128 256 185.308 256 256 C 185.308 256 128 198.692 128 128 Z M 0 0 C 70.692 0 128 57.308 128 128 C 57.308 128 0 70.692 0 0 Z M 256 0 C 256 70.692 198.692 128 128 128 C 128 57.308 185.308 0 256 0 Z" /></svg>
        auralis
      </div>
      <div id="live" role="status" aria-live="polite"><i></i><span>Idle</span></div>
    </header>

    <main>
      <div id="warning" role="alert"></div>

      <section>
        <h2>Shortcuts</h2>
        <label for="ptt">Push to talk</label>
        <div class="keyrow">
          <input id="ptt" type="text" placeholder="Ctrl+Space" spellcheck="false" />
          <button type="button" data-record="ptt">Record</button>
        </div>
        <div class="hint">Hold to speak, release to type.</div>

        <label for="toggle">Hands-free toggle</label>
        <div class="keyrow">
          <input id="toggle" type="text" placeholder="Ctrl+Shift+Space" spellcheck="false" />
          <button type="button" data-record="toggle">Record</button>
        </div>
        <div class="hint">Tap once to start, tap again to stop.</div>
      </section>

      <section>
        <h2>Speech model</h2>
        <label for="model">Active model</label>
        <select id="model"></select>
        <label>Available models</label>
        <div id="models"></div>
        <progress id="progress" value="0" max="100" hidden></progress>
        <div class="hint">Larger models are more accurate but slower. Everything runs on this PC.</div>
      </section>

      <section>
        <h2>Input</h2>
        <label for="mic">Microphone</label>
        <select id="mic"></select>
      </section>

      <section>
        <h2>Text</h2>
        <label for="cleanup">Cleanup</label>
        <select id="cleanup"></select>
        <div class="hint" id="cleanup-hint"></div>
      </section>
    </main>

    <footer>
      <div id="status" role="status" aria-live="polite"></div>
      <button id="cancel" type="button">Close</button>
      <button id="save" class="primary" type="button">Save</button>
    </footer>

    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const { getCurrentWindow } = window.__TAURI__.window;

      const ptt = document.getElementById("ptt");
      const toggle = document.getElementById("toggle");
      const model = document.getElementById("model");
      const modelList = document.getElementById("models");
      const progress = document.getElementById("progress");
      const mic = document.getElementById("mic");
      const cleanup = document.getElementById("cleanup");
      const cleanupHint = document.getElementById("cleanup-hint");
      const status = document.getElementById("status");
      const warning = document.getElementById("warning");
      const live = document.getElementById("live");

      const CLEANUP_HINTS = {
        raw: "Exactly what the model heard. No casing or punctuation added.",
        clean: "Capitalization and a closing punctuation mark.",
        polished: "Clean, plus removes “uh” and “um”.",
        developer: "Removes filler words but adds no capital letter and no trailing period.",
      };

      let activeModel = "";

      function updateCleanupHint() {
        cleanupHint.textContent = CLEANUP_HINTS[cleanup.value] || "";
      }

      function setStatus(text, kind) {
        status.textContent = text;
        status.className = kind || "";
      }

      function kindOf(s) {
        if (s.startsWith("Listening")) return "listening";
        if (/^(Processing|Downloading|Loading)/.test(s)) return "busy";
        if (/(error|failed|unavailable|not ready|No speech)/i.test(s)) return "error";
        return "ok";
      }

      listen("auralis://status", (event) => {
        live.className = kindOf(event.payload);
        live.querySelector("span").textContent = event.payload;
      });

      function fillSelect(select, options, selected, emptyLabel) {
        select.innerHTML = "";
        if (emptyLabel !== undefined) {
          const none = document.createElement("option");
          none.value = "";
          none.textContent = emptyLabel;
          select.appendChild(none);
        }
        for (const opt of options) {
          const el = document.createElement("option");
          el.value = opt.value;
          el.textContent = opt.label;
          select.appendChild(el);
        }
        const values = options.map((o) => o.value);
        select.value = values.includes(selected) ? selected : emptyLabel !== undefined ? "" : values[0] || "";
      }

      const plain = (v) => ({ value: v, label: v });

      function renderModels(models) {
        const installed = models.filter((m) => m.installed);
        fillSelect(
          model,
          installed.map((m) => ({ value: m.file, label: m.label })),
          model.value || activeModel
        );

        modelList.innerHTML = "";
        for (const m of models) {
          const row = document.createElement("div");
          row.className = "model";
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = m.size_mb ? `${m.label} (${m.size_mb} MB)` : m.label;
          row.appendChild(name);
          if (m.installed) {
            const ok = document.createElement("span");
            ok.className = "state";
            ok.textContent = "Installed";
            row.appendChild(ok);
          } else {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = "Download";
            btn.addEventListener("click", () => downloadModel(m.file));
            row.appendChild(btn);
          }
          modelList.appendChild(row);
        }
      }

      async function refreshModels() {
        renderModels(await invoke("list_models"));
      }

      async function downloadModel(file) {
        modelList.querySelectorAll("button").forEach((b) => (b.disabled = true));
        progress.hidden = false;
        progress.value = 0;
        setStatus("Downloading model…", "");
        try {
          await invoke("download_model", { file });
          setStatus("Model downloaded.", "ok");
        } catch (e) {
          setStatus(String(e), "error");
        } finally {
          progress.hidden = true;
          await refreshModels();
        }
      }

      listen("auralis://model-progress", (event) => {
        const { downloaded, total } = event.payload;
        if (total) progress.value = Math.round((downloaded * 100) / total);
      });

      const KEY_NAMES = { " ": "Space", ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right", Escape: "Esc" };
      let recording = null;

      function stopRecording() {
        if (!recording) return;
        recording.input.classList.remove("recording");
        recording.button.textContent = "Record";
        recording = null;
      }

      document.querySelectorAll("[data-record]").forEach((button) => {
        button.addEventListener("click", () => {
          const wasThis = recording && recording.button === button;
          stopRecording();
          if (wasThis) return;
          const input = document.getElementById(button.dataset.record);
          recording = { input, button };
          input.classList.add("recording");
          button.textContent = "Press keys…";
          input.focus();
        });
      });

      window.addEventListener(
        "keydown",
        (e) => {
          if (!recording) return;
          e.preventDefault();
          e.stopPropagation();
          if (e.key === "Escape") return stopRecording();
          if (["Control", "Shift", "Alt", "Meta"].includes(e.key)) return;
          const mods = [];
          if (e.ctrlKey) mods.push("Ctrl");
          if (e.altKey) mods.push("Alt");
          if (e.shiftKey) mods.push("Shift");
          if (e.metaKey) mods.push("Super");
          const raw = KEY_NAMES[e.key] || (e.key.length === 1 ? e.key.toUpperCase() : e.key);
          recording.input.value = [...mods, raw].join("+");
          stopRecording();
        },
        true
      );

      async function load() {
        try {
          const [config, models, mics, cleanupModes, startupWarning] = await Promise.all([
            invoke("get_config"),
            invoke("list_models"),
            invoke("list_mic_devices"),
            invoke("list_cleanup_modes"),
            invoke("get_startup_warning"),
          ]);
          if (startupWarning) {
            warning.textContent = startupWarning;
            warning.style.display = "block";
          }
          ptt.value = config.push_to_talk_hotkey;
          toggle.value = config.toggle_hotkey;
          activeModel = config.model_file;
          renderModels(models);
          fillSelect(mic, mics.map(plain), config.mic_device, "(system default)");
          fillSelect(cleanup, cleanupModes.map(plain), config.cleanup_mode);
          updateCleanupHint();
        } catch (e) {
          setStatus(`Failed to load settings: ${e}`, "error");
        }
      }

      document.getElementById("save").addEventListener("click", async () => {
        stopRecording();
        setStatus("Saving…", "");
        try {
          await invoke("save_config", {
            newConfig: {
              push_to_talk_hotkey: ptt.value.trim(),
              toggle_hotkey: toggle.value.trim(),
              model_file: model.value,
              mic_device: mic.value || null,
              cleanup_mode: cleanup.value,
            },
          });
          warning.style.display = "none";
          setStatus("Saved.", "ok");
        } catch (e) {
          setStatus(String(e), "error");
        }
      });

      cleanup.addEventListener("change", updateCleanupHint);

      document.getElementById("cancel").addEventListener("click", () => {
        getCurrentWindow().close();
      });

      load();
    </script>
  </body>
</html>
