<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Auralis</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
      #pill {
        display: flex; align-items: center; gap: 10px;
        max-width: 280px; padding: 10px 18px;
        background: rgba(17, 17, 17, 0.92); color: #f2f2f2;
        border: 1px solid #333; border-radius: 999px;
        font-size: 14px; font-weight: 600; white-space: nowrap;
      }
      #text { overflow: hidden; text-overflow: ellipsis; }
      #dot { width: 10px; height: 10px; border-radius: 50%; background: #888; flex: none; }
      #pill.listening #dot { background: #e5484d; animation: pulse 1s ease-in-out infinite; }
      #pill.busy #dot { background: #f5a524; animation: pulse 0.6s ease-in-out infinite; }
      #pill.ok #dot { background: #3fb950; }
      #pill.error #dot { background: #e5484d; }
      @keyframes pulse { 50% { opacity: 0.35; } }
    </style>
  </head>
  <body>
    <div id="pill"><span id="dot"></span><span id="text">Idle</span></div>
    <script>
      const { listen } = window.__TAURI__.event;
      const pill = document.getElementById("pill");
      const text = document.getElementById("text");

      function kindOf(status) {
        if (status.startsWith("Listening")) return "listening";
        if (/^(Processing|Downloading|Loading)/.test(status)) return "busy";
        if (/(error|failed|unavailable|not ready|No speech)/i.test(status)) return "error";
        return "ok";
      }

      listen("auralis://status", (event) => {
        text.textContent = event.payload;
        pill.className = kindOf(event.payload);
      });
    </script>
  </body>
</html>
