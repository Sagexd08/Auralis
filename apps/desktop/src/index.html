<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Auralis</title>
    <style>
      :root { --accent: #e3ad5f; --ease: cubic-bezier(0.16, 1, 0.3, 1); }
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; font: 600 13px/1 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      #pill {
        display: flex; align-items: center; gap: 10px;
        max-width: 284px; padding: 10px 16px 10px 14px;
        background: rgba(13, 11, 9, 0.94); color: #f4f1ec;
        border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14), 0 6px 18px rgba(0, 0, 0, 0.45);
        white-space: nowrap; animation: pop 0.45s var(--ease) both;
        transition: box-shadow 0.3s;
      }
      @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(0.96); } to { opacity: 1; transform: none; } }
      #text { overflow: hidden; text-overflow: ellipsis; }

      #glyph { position: relative; width: 22px; height: 16px; flex: none; display: flex; align-items: center; justify-content: center; }
      #dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(244, 241, 236, 0.5); transition: background-color 0.25s; }
      #bars { display: none; align-items: center; gap: 2px; height: 16px; }
      #bars i { display: block; width: 3px; height: 4px; border-radius: 2px; background: var(--accent); animation: bar 0.8s ease-in-out infinite; }
      #bars i:nth-child(2) { animation-delay: -0.2s; } #bars i:nth-child(3) { animation-delay: -0.5s; } #bars i:nth-child(4) { animation-delay: -0.1s; } #bars i:nth-child(5) { animation-delay: -0.35s; }
      @keyframes bar { 0%, 100% { height: 4px; } 50% { height: 15px; } }

      #pill.listening { box-shadow: inset 0 0 0 1px rgba(227, 173, 95, 0.7), 0 6px 18px rgba(0, 0, 0, 0.45); }
      #pill.listening #dot { display: none; }
      #pill.listening #bars { display: flex; }
      #pill.busy #dot { background: var(--accent); animation: pulse 0.6s ease-in-out infinite; }
      #pill.ok #dot { background: #8fd18f; }
      #pill.error #dot { background: #ff9b8f; }
      #pill.error { box-shadow: inset 0 0 0 1px rgba(255, 155, 143, 0.55), 0 6px 18px rgba(0, 0, 0, 0.45); }
      @keyframes pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } #bars i { height: 10px; } }
    </style>
  </head>
  <body>
    <div id="pill" role="status" aria-live="polite">
      <span id="glyph" aria-hidden="true"><span id="dot"></span><span id="bars"><i></i><i></i><i></i><i></i><i></i></span></span>
      <span id="text">Idle</span>
    </div>
    <script>
      const { listen } = window.__TAURI__.event;
      const pill = document.getElementById("pill");
      const text = document.getElementById("text");

      function kindOf(status) {
        if (status.startsWith("Listening")) return "listening";
        if (/^(Processing|Downloading|Loading)/.test(status)) return "busy";
        if (/(error|failed|unavailable|not ready|No speech)/i.test(status)) return "error";
        return "ok";
      }

      listen("auralis://status", (event) => {
        text.textContent = event.payload;
        pill.className = kindOf(event.payload);
      });
    </script>
  </body>
</html>
