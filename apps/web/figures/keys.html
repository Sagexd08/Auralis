<script id="hl-bench">

(() => {
  const RULES = ["hit", "order", "reach", "accent", "rest", "honesty", "cost", "clock", "radius", "quiet"];
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement, params = new URLSearchParams(location.search);

  const dark = () => (root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
  const label = () => { $("theme").textContent = dark() ? "dark" : "light"; };
  $("theme").addEventListener("click", () => { root.dataset.theme = dark() ? "light" : "dark"; label(); });

  if (["light", "dark"].includes(params.get("theme"))) root.dataset.theme = params.get("theme");
  label();

  const i = (params.get("intensity") || "").trim();
  if (i && Number.isFinite(Number(i))) $("intensity").value = String(Math.min(1, Math.max(0, Number(i))));

  const w = Number(params.get("w"));
  if (w > 0) document.querySelector("main").style.maxWidth = w + "px";

  addEventListener("error", (e) => {
    $("error").hidden = false;
    $("error").textContent = String((e.error && e.error.message) || e.message);
  });

  let mounted = false;
  window.hairline = (figure) => {
    if (mounted) throw new Error("hairline: one figure per page.");
    mounted = true;
    const stage = $("stage"), slider = $("intensity");

    const [lo, mid, hi] = figure.range;
    const at = (i) => Math.round((i <= 0.5 ? lo + (i / 0.5) * (mid - lo) : mid + ((i - 0.5) / 0.5) * (hi - mid)) * 1000) / 1000;

    HL.inject(document);
    stage.setAttribute("data-hairline", figure.name);
    stage.setAttribute("role", "img");
    stage.setAttribute("aria-label", figure.means);
    const svg = HL.mk("svg", { viewBox: "0 0 400 320", "aria-hidden": "true" }, stage);

    let text = null;
    const read = {
      get textContent() { return text; },
      set textContent(value) { text = value == null ? "" : String(value); $("read").textContent = text; },
    };

    document.title = "Hairline · " + figure.name;
    $("name").textContent = figure.name;
    $("means").textContent = figure.means;
    $("rules").textContent = figure.rules.map((n) => String(n).padStart(2, "0") + " " + RULES[n - 1]).join(" · ");
    const show = () => { $("value").textContent = String(at(Number(slider.value))); };
    show();

    const handle = figure.mount({ stage, svg, read }, at(Number(slider.value)));
    if (text === null) read.textContent = "rest";
    slider.addEventListener("input", () => { show(); handle.set(at(Number(slider.value))); });
    window.hairline.figure = handle;

    const p = (params.get("at") || "").split(",").map(Number);
    if (p.length === 2 && p.every(Number.isFinite)) {
      const r = stage.getBoundingClientRect();
      stage.dispatchEvent(new PointerEvent("pointermove", {
        pointerType: "mouse", pointerId: 1, bubbles: true,
        clientX: r.left + (p[0] / 400) * r.width, clientY: r.top + (p[1] / 320) * r.height,
      }));
    }
  };
})();
</script>
<script type="module" id="hl-figure">
const {
  Cam, clamp, facing, fit, prism, proj, rings, unproj, spring, stepS,
  mk, pointer, put, register, disposer, solid,
} = HL;

const COLS = 10, ROWS = 4, CELL = 14, FOOT = 11, PB = 5, UP = 9, DOWN = 2.4;
const EXT_X = COLS * CELL, EXT_Y = ROWS * CELL;
const SPACE = { c0: 2, c1: 8, r: 3 };

const falloff = (u) =>
  u <= 0 ? 1 : u <= 0.45 ? 1 - (u / 0.45) * 0.62 : u <= 1 ? 0.38 - ((u - 0.45) / 0.55) * 0.3 : 0.08;

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  const C = Cam(45, 0.5, 2.05);
  fit(C, [[-6, -6, -PB], [EXT_X + 6, EXT_Y + 6, -PB], [EXT_X + 6, -6, UP], [-6, EXT_Y + 6, UP]], 200, 170);
  const P = proj(C), front = facing(C);
  let R = value * CELL, over = null;

  const g = mk("g", {}, svg);
  const [pr, pi] = rings(-6, -6, EXT_X + 6, EXT_Y + 6, 9, 2.2);
  put(solid(g), prism(P, front, pr, pi, -PB, 0));

  const keys = [];
  const add = (c0, c1, r, name) => {
    const x0 = c0 * CELL + (CELL - FOOT) / 2, x1 = c1 * CELL - (CELL - FOOT) / 2;
    const y0 = r * CELL + (CELL - FOOT) / 2, y1 = y0 + FOOT;
    const [ring, inner] = rings(x0, y0, x1, y1, 2.6, 0.9);
    const tilt = (ROWS - 1 - r) * 0.7;
    const pressed = name === "ctrl" ? UP - 4 : UP + tilt;
    keys.push({
      name, c0, c1, r, ring, inner, h0: pressed,
      cx: ((c0 + c1) / 2) * CELL, cy: (r + 0.5) * CELL,
      sp: spring(pressed, { eps: 0.03 }), el: solid(g), drawn: NaN,
    });
  };
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (r === SPACE.r && c >= SPACE.c0 && c < SPACE.c1) continue;
      add(c, c + 1, r, r === SPACE.r && c === 0 ? "ctrl" : `${r}·${c}`);
    }
  }
  add(SPACE.c0, SPACE.c1, SPACE.r, "space");
  keys.sort((a, b) => (a.c1 * CELL + (a.r + 1) * CELL) - (b.c1 * CELL + (b.r + 1) * CELL) || a.c0 - b.c0);
  keys.forEach((k) => g.appendChild(k.el.g));
  const space = keys.find((k) => k.name === "space");
  let want = space;

  const drawKey = (k) => {
    const h = Math.max(0.8, k.sp.x);
    const hi = k === want;
    if (h === k.drawn && k.hi === hi) return;
    k.drawn = h;
    k.hi = hi;
    put(k.el, prism(P, front, k.ring, k.inner, 0, h));
    k.el.sil.classList.toggle("hi", hi);
  };

  const B = register(stage, (dt) => {
    let moving = false;
    for (const k of keys) { if (stepS(k.sp, dt)) moving = true; drawKey(k); }
    return moving;
  });
  bag.add(B.unregister);

  const hit = (x, y) => {
    const c = clamp(Math.floor(x / CELL), 0, COLS - 1), r = clamp(Math.floor(y / CELL), 0, ROWS - 1);
    if (r === SPACE.r && c >= SPACE.c0 && c < SPACE.c1) return space;
    return keys.find((k) => k !== space && k.r === r && k.c0 === c);
  };

  function retarget() {
    for (const k of keys) {
      if (!over) { k.sp.t = k.h0; continue; }
      const d = Math.hypot(k.cx - over[0], k.cy - over[1]);
      k.sp.t = lerpDown(k.h0, falloff(d / R));
    }
    if (over && over[0] >= 0 && over[1] >= 0 && over[0] <= EXT_X && over[1] <= EXT_Y) {
      want = hit(over[0], over[1]);
      read.textContent = want.name === "space" ? "space" : want.name === "ctrl" ? "ctrl" : `key ${want.name}`;
    } else {
      want = space;
      read.textContent = "rest";
    }
    B.wake();
  }

  const lerpDown = (h0, share) => h0 - (h0 - DOWN) * share;

  bag.add(pointer(stage, {
    move: (p) => { over = unproj(C, p[0], p[1], 0); retarget(); },
    leave: () => { over = null; retarget(); },
  }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { R = v * CELL; if (over) retarget(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "keys",
  means: "A keyboard whose keys sink under the pointer and spread out from it, the space bar lit.",
  rules: [1, 3, 5, 9],
  range: [1.2, 2.4, 4],
  mount,
});
</script>
