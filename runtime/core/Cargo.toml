[package]
name = "auralis-runtime"
version = "0.1.0"
edition = "2021"

[lib]
name = "auralis_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
rubato = "0.15"
cpal = "0.15"
crossbeam-channel = "0.5"
webrtc-vad = "0.4"
nnnoiseless = "0.5"
whisper-rs = "0.13"
regex = "1"
once_cell = "1"
hound = "3.5"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "auralis-bench-cli"
path = "src/bin/bench_cli.rs"
