[package]
name = "auralis-runtime"
version = "0.1.0"
edition = "2021"

[lib]
name = "auralis_runtime"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
rubato = "0.15"
cpal = "0.15"
crossbeam-channel = "0.5"
webrtc-vad = "0.4"
nnnoiseless = "0.5"
whisper-rs = { version = "0.13", features = ["whisper-cpp-log"] }
regex = "1"
once_cell = "1"
hound = "3.5"
clap = { version = "4", features = ["derive"] }
log = "0.4"

tiny_http = "0.12"
tungstenite = "0.24"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

[features]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[[bin]]
name = "auralis-bench-cli"
path = "src/bin/bench_cli.rs"

[[bin]]
name = "auralis-server"
path = "src/bin/server.rs"

[[bin]]
name = "auralis-router"
path = "src/bin/router.rs"
