name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install a bindgen-compatible libclang
        shell: pwsh
        run: |
          pip install libclang
          $native = python -c "import clang, os; print(os.path.join(os.path.dirname(clang.__file__), 'native'))"
          "LIBCLANG_PATH=$native" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch the third-party Whisper base.en model (installer only)
        shell: pwsh
        run: |
          # Whisper (MIT, OpenAI) is fetched from its upstream at build time and checksum-pinned.
          # It is bundled into the installer only and is never published as an Auralis model.
          New-Item -ItemType Directory -Force models/bundled | Out-Null
          $dest = "models/bundled/ggml-base.en-q5_1.bin"
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin" -OutFile $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "4baf70dd0d7c4247ba2b81fafd9c01005ac77c2f9ef064e00dcf195d0e2fdd2f") { throw "unexpected model checksum: $hash" }

      - name: npm ci
        working-directory: apps/desktop
        run: npm ci

      - name: Import signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $override = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "sign.json") -Value $override
          "SIGN_CONFIG=$(Join-Path $env:RUNNER_TEMP 'sign.json')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if ($env:SIGN_CONFIG) { npx tauri build --bundles nsis --config $env:SIGN_CONFIG }
          else { npx tauri build --bundles nsis }

      - name: Verify installer and write SHA-256 checksums
        shell: pwsh
        run: |
          $dir = "target/release/bundle/nsis"
          $exes = Get-ChildItem $dir -Filter *.exe
          if ($exes.Count -ne 1) { throw "expected exactly one installer in $dir, found $($exes.Count)" }
          if ($exes[0].Length -lt 1MB) { throw "installer is suspiciously small: $($exes[0].Length) bytes" }
          $lines = $exes | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          Set-Content -Path "$dir/SHA256SUMS.txt" -Value $lines -Encoding ascii
          Get-Content "$dir/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: auralis-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
