name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-tests:
    name: runtime tests (no model — STT test self-skips)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build deps (bindgen + ALSA for cpal)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: cargo test -p auralis-runtime
        run: cargo test -p auralis-runtime --locked

  desktop-build:
    name: desktop build (Tauri, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build deps (bindgen + ALSA + Tauri/webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev cmake libasound2-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: npm install
        working-directory: apps/desktop
        run: npm ci

      - name: cargo build -p auralis-desktop
        run: cargo build -p auralis-desktop --locked
