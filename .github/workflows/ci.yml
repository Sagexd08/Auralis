name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-tests:
    name: runtime tests (no model — STT test self-skips)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build deps (bindgen + ALSA for cpal)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: cargo test -p auralis-runtime
        run: cargo test -p auralis-runtime --locked

  runtime-clippy:
    name: runtime clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build deps (bindgen + ALSA for cpal)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: cargo clippy -p auralis-runtime
        run: cargo clippy -p auralis-runtime --all-targets --locked -- -D warnings

  desktop-build:
    name: desktop build (Tauri, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build deps (bindgen + ALSA + xdo + Tauri/webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev cmake libasound2-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: npm install
        working-directory: apps/desktop
        run: npm ci

      - name: cargo test -p auralis-desktop
        run: cargo test -p auralis-desktop --locked

  benchmarks:
    name: benchmark harness (imports + smoke, self-skips without a model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/requirements.txt

      - name: Install harness deps
        run: pip install -r benchmarks/requirements.txt

      - name: python -m unittest
        working-directory: benchmarks
        run: python -m unittest discover -s tests -v

  web:
    name: web (static page sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check markup is well-formed
        run: |
          python - <<'PY'
          import html.parser, sys, pathlib

          VOID = {'meta','link','br','img','hr','input','area','base',
                  'col','embed','source','track','wbr'}

          class Check(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack = []
                  self.bad = []
              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append(tag)
              def handle_endtag(self, tag):
                  if self.stack and self.stack[-1] == tag:
                      self.stack.pop()
                  elif tag in self.stack:
                      self.bad.append(f'</{tag}> closes out of order (open: {self.stack[-3:]})')

          failed = False
          for path in pathlib.Path('apps/web').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              for marker in ('<<<<<<<', '>>>>>>>'):
                  if marker in text:
                      print(f'{path}: merge conflict marker {marker!r}')
                      failed = True
              parser = Check()
              parser.feed(text)
              for problem in parser.bad:
                  print(f'{path}: {problem}')
                  failed = True
              if parser.stack:
                  print(f'{path}: unclosed tags {parser.stack}')
                  failed = True
              if not failed:
                  print(f'{path}: OK')
          sys.exit(1 if failed else 0)
          PY

  docker:
    name: docker images (server + router) and compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose --profile observability config -q

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: server
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build router image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: router
          push: false
          cache-from: type=gha,scope=server
